# Alembic-Konfiguration für Opentakt Rewe. Die URL setzt die App zur
# Laufzeit aus DATABASE_URL (siehe app/migration.py); dieser Wert ist nur
# ein lokaler Fallback für direkte alembic-Aufrufe.
[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./buchhaltung-lokal.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
