name: Idee
description: Funktion oder Verbesserung vorschlagen
title: "[Idee] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll das lösen?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Vorschlag
      placeholder: Wie könnte es in der App aussehen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - Rechnungen / Kunden
        - Belege / Kontozeilen
        - DATEV-Export
        - Deploy / Backup
        - Anderes
